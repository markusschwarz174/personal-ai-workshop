  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

  const parentWindow = globalThis.parent;

  );

  initialStateElement?.remove();

  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;

  const pendingStateWrites = new Map();

      {

   * @param {string} property

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

      new CustomEvent(&quot;openai:set_globals&quot;, {

        reject(persistenceError());

      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,

      visualizationTheme: theme,
      widgetState: state,
      statePersistence,

    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));

        return;
      }

        target == null ||

  #advisor-comic-council .acc-active-portrait {
    width: calc(54px * var(--active-scale));
    height: calc(132px * var(--active-scale));
    filter: saturate(1.17) contrast(1.04) drop-shadow(5px 7px 0 var(--c-shadow));
    transform-origin: bottom center;
  }

  #advisor-comic-council .acc-speech {
    position: relative;
    z-index: 2;
    width: min(100%, 260px);
    margin-top: -20px;
    padding: 9px 12px;
    border: 3px solid var(--c-line);
    border-radius: 18px 18px 18px 5px;
    background: var(--c-panel);
    box-shadow: 4px 5px 0 var(--c-line);
    text-align: center;
  }

  #advisor-comic-council .acc-speech strong,
  #advisor-comic-council .acc-speech span { display: block; }
  #advisor-comic-council .acc-speech strong { font-size: 1.42rem; letter-spacing: .035em; }
  #advisor-comic-council .acc-speech span { margin-top: 3px; color: var(--c-muted); font-size: .83rem; }

  #advisor-comic-council .acc-council {
    position: relative;
    min-height: 316px;
  }

  #advisor-comic-council .acc-table {
    position: absolute;
    z-index: 1;
    left: 34%;
    right: 34%;
    top: 128px;
    height: 48px;
    border: 4px solid var(--c-line);
    border-radius: 48% 48% 42% 42% / 44% 44% 56% 56%;
    background:
      repeating-linear-gradient(7deg, transparent 0 17px, color-mix(in srgb, var(--c-wood-2) 36%, transparent) 18px 20px, transparent 21px 35px),
      radial-gradient(ellipse at 30% 35%, transparent 0 14%, color-mix(in srgb, var(--c-wood-2) 48%, transparent) 14.5% 16%, transparent 17% 100%),
      linear-gradient(90deg, var(--c-wood-1), var(--c-wood-3) 28%, var(--c-wood-1) 58%, var(--c-wood-2));
    box-shadow: 8px 12px 0 var(--c-shadow), inset 0 8px 0 color-mix(in srgb, var(--c-wood-3) 60%, transparent);
    transform: perspective(650px) rotateX(7deg);
  }
  #advisor-comic-council .acc-table::before,
  #advisor-comic-council .acc-table::after {
    content: &quot;&quot;;
    position: absolute;
    top: 84%;
    width: 18px;
    height: 38px;
    border: 3px solid var(--c-line);
    background: var(--c-wood-2);
    z-index: -1;
  }
  #advisor-comic-council .acc-table::before { left: 17%; transform: rotate(3deg); }
  #advisor-comic-council .acc-table::after { right: 17%; transform: rotate(-3deg); }
  #advisor-comic-council .acc-table-edge {
    position: absolute;
    left: 5%; right: 5%; bottom: 4px; height: 8px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--c-wood-2) 76%, transparent);
  }
  #advisor-comic-council .acc-table-shine {
    position: absolute;
    left: 22%; right: 24%; top: 10px; height: 5px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--c-yellow) 34%, transparent);
    transform: rotate(-2deg);
  }

  #advisor-comic-council .acc-seat {
    position: absolute;
    z-index: 2;
    width: 88px;
    min-height: 116px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--c-ink);
    text-align: center;
  }
  #advisor-comic-council .acc-seat:not(.is-active-seat) { opacity: var(--inactive-opacity); }
  #advisor-comic-council .acc-seat:not(.is-active-seat):hover,
  #advisor-comic-council .acc-seat:not(.is-active-seat):focus-visible { opacity: .86; filter: saturate(1.18); }
  #advisor-comic-council .acc-seat-portrait {
    display: block;
    width: 54px;
    height: 132px;
    margin: 0 auto -22px;
    filter: saturate(.62) brightness(1.08) drop-shadow(3px 4px 0 var(--c-shadow));
    transition: transform .18s ease, filter .18s ease;
  }
  #advisor-comic-council .acc-seat:hover .acc-seat-portrait,
  #advisor-comic-council .acc-seat:focus-visible .acc-seat-portrait { transform: translateY(-7px) rotate(-2deg); filter: saturate(1); }
  #advisor-comic-council .acc-seat-label {
    position: relative;
    display: inline-block;
    max-width: 88px;
    padding: 4px 7px;
    border: 2px solid var(--c-line);
    border-radius: 8px;
    background: var(--c-panel);
    font-size: .7rem;
    font-weight: 500;
    letter-spacing: .02em;
  }
  #advisor-comic-council .acc-seat.is-active-seat { pointer-events: none; }
  #advisor-comic-council .acc-seat.is-active-seat .acc-seat-portrait {
    opacity: .08;
    filter: grayscale(1);
  }
  #advisor-comic-council .acc-seat.is-active-seat .acc-seat-label {
    border-style: dashed;
    background: color-mix(in srgb, var(--c-yellow) 20%, var(--c-panel));
  }
  #advisor-comic-council .acc-seat.is-active-seat .acc-seat-label::after { content: &quot; · IM EINSATZ&quot;; color: var(--c-coral); }

  #advisor-comic-council .seat-0 { left: 12%; top: 104px; }
  #advisor-comic-council .seat-1 { left: calc(50% - 44px); top: 196px; z-index: 3; }
  #advisor-comic-council .seat-2 { left: 28%; top: 172px; z-index: 3; }
  #advisor-comic-council .seat-3 { right: 28%; top: 172px; z-index: 3; }
  #advisor-comic-council .seat-4 { right: 32%; top: 12px; }
  #advisor-comic-council .seat-5 { right: 12%; top: 104px; }
  #advisor-comic-council .seat-6 { left: 32%; top: 12px; }

  #advisor-comic-council .acc-second-row {
    display: grid;
    grid-template-columns: minmax(290px, .95fr) minmax(380px, 1.35fr);
    gap: 12px;
    margin-top: 14px;
    height: 278px;
  }

  #advisor-comic-council .acc-specs,
  #advisor-comic-council .acc-modes {
    height: 100%;
    padding: 12px;
    border: 3px solid var(--c-line);
    border-radius: 20px;
    background: var(--c-panel);
    box-shadow: 6px 7px 0 var(--c-shadow);
  }

  #advisor-comic-council .acc-section-title { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  #advisor-comic-council .acc-section-title strong,
  #advisor-comic-council .acc-section-title small { display: block; }
  #advisor-comic-council .acc-section-title strong { letter-spacing: .03em; }
  #advisor-comic-council .acc-section-title small { margin-top: 2px; color: var(--c-muted); }
  #advisor-comic-council .acc-spec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  #advisor-comic-council .acc-spec {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 46px;
    padding: 7px 9px;
    border: 2px solid var(--c-line);
    border-radius: 13px;
    color: light-dark(#172033, #fff);
    box-shadow: 3px 3px 0 var(--c-line);
    transform: rotate(var(--tilt, 0deg));
  }
  #advisor-comic-council .acc-spec svg { width: 22px; height: 22px; flex: 0 0 auto; }
  #advisor-comic-council .acc-goal { background: var(--c-coral); --tilt: -1deg; }
  #advisor-comic-council .acc-context { background: var(--c-blue); --tilt: 1deg; }
  #advisor-comic-council .acc-output { background: var(--c-yellow); --tilt: 1deg; color: light-dark(#172033, #172033); }
  #advisor-comic-council .acc-boundaries { background: var(--c-green); --tilt: -1deg; }

  #advisor-comic-council .acc-mode-avatar {
    flex: 0 0 46px;
    width: 46px;
    height: 50px;
    border: 2px solid var(--c-line);
    border-radius: 50% 50% 42% 42%;
    background-color: color-mix(in srgb, var(--c-yellow) 24%, var(--c-panel));
    box-shadow: 3px 3px 0 var(--c-line);
  }
  #advisor-comic-council .acc-mode-grid { display: grid; grid-template-columns: repeat(var(--mode-cols, 2), minmax(0, 1fr)); gap: 7px; }
  #advisor-comic-council .acc-mode-card {
    position: relative;
    min-height: 58px;
    padding: 8px;
    border: 2px solid var(--c-line);
    border-radius: 14px;
    background:
      radial-gradient(circle at 87% 16%, color-mix(in srgb, var(--mode-color) 36%, transparent) 0 18px, transparent 19px),
      color-mix(in srgb, var(--mode-color) 13%, var(--c-panel));
    box-shadow: 3px 4px 0 var(--c-line);
  }
  #advisor-comic-council .acc-mode-head {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #advisor-comic-council .acc-mode-icon {
    display: grid;
    place-items: center;
    flex: 0 0 24px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--mode-color);
    color: light-dark(#172033, #fff);
    transform: rotate(-5deg);
  }
  #advisor-comic-council .acc-mode-icon svg { width: 15px; height: 15px; }
  #advisor-comic-council .acc-mode-card strong { font-size: .78rem; overflow-wrap: anywhere; }
  #advisor-comic-council .acc-mode-description { display: block; margin-top: 5px; color: var(--c-muted); font-size: .72rem; }

  /* V6: kompakte Agentenrunde oben und sieben feste Modi-Slots über die volle Breite. */
  #advisor-comic-council .acc-top {
    grid-template-columns: minmax(190px, .5fr) minmax(660px, 2.2fr);
    gap: 14px;
    height: 263px;
  }
  #advisor-comic-council .acc-active,
  #advisor-comic-council .acc-council { min-height: 237px; }
  #advisor-comic-council .acc-burst { inset: 12px 8px 28px; }
  #advisor-comic-council .acc-speech {
    width: min(100%, 210px);
    margin-top: -16px;
    padding: 7px 9px;
  }
  #advisor-comic-council .acc-speech strong { font-size: 1.15rem; }
  #advisor-comic-council .acc-speech span { font-size: .74rem; }
  #advisor-comic-council .acc-seat { width: 76px; min-height: 82px; }
  #advisor-comic-council .acc-seat-portrait {
    width: 32px;
    height: 78px;
    margin-bottom: -14px;
  }
  #advisor-comic-council .acc-seat-label {
    max-width: 76px;
    padding: 3px 5px;
    font-size: .66rem;
  }
  #advisor-comic-council .acc-seat.is-active-seat .acc-seat-label::after { display: none; }
  #advisor-comic-council .acc-table {
    left: 24%;
    right: 24%;
    top: 92px;
    height: 40px;
  }
